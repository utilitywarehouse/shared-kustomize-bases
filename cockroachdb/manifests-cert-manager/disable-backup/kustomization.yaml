apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: disable-backup.yaml
  - target:
      kind: StatefulSet
      name: cockroachdb
    patch: |
      - op: remove
        path: /spec/template/metadata/annotations/vault.uw.systems~1aws-credentials
      - op: remove
        path: /spec/template/spec/serviceAccountName
